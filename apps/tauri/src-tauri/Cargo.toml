[package]
name = "fulcrum"
version = "1.0.1"
description = "Management software for movement science experts, leveraging flow diagrams for intervention creation and patient management, including comprehensive data analysis."
authors = ["Antonio Logarzo"]
license = "CC BY-NC-ND 4.0 Deed"
repository = "https://github.com/MrTimedying/fulcrumproject"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.0-beta.23", features = ["tray-icon", "wry", "devtools"], default-features = false }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", features = ["tracing", "colored"] }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", features = ["rustls-tls", "native-tls"] }
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tokio = { version = "1.x", features = ["full"] }
aes = { version = "0.9.0-rc.0" }
cbc = { version = "0.2.0-rc.0", features = ["alloc", "zeroize"] }
rand = { version = "0.8", features = ["small_rng"] }
hex = "0.4"
keyring = "2.0"
anyhow = "1.0"
dirs = "5.0.1"
uuid = { version = "1.20.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
